<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NihongoGarden</title>
  <link rel="stylesheet" href="style.css">
  <script>
    (function (d) {
      var config = {
        kitId: 'jjz7uub',
        scriptTimeout: 3000,
        async: true
      },
        h = d.documentElement, t = setTimeout(function () { h.className = h.className.replace(/\bwf-loading\b/g, "") + " wf-inactive"; }, config.scriptTimeout), tk = d.createElement("script"), f = false, s = d.getElementsByTagName("script")[0], a; h.className += " wf-loading"; tk.src = 'https://use.typekit.net/' + config.kitId + '.js'; tk.async = true; tk.onload = tk.onreadystatechange = function () { a = this.readyState; if (f || a && a != "complete" && a != "loaded") return; f = true; clearTimeout(t); try { Typekit.load(config) } catch (e) { } }; s.parentNode.insertBefore(tk, s)
    })(document);
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <audio id="background-music" src="background-music.mp3" autoplay loop preload="auto"></audio>
  <div id="main-scene">
    <div id="top-bar"> <!-- heads-up display -->
      <div class="hud-stat">🪙 <span id="hud-coins">10</span></div>
      <div class="hud-stat">⭐ LVL <span id="hud-level">0</span></div>
      <div class="hud-stat">⚡ EXP: <span id="hud-exp">0/100</span></div>
    </div>

    <div id="world">
      <!-- Plots are rendered from the gardenPlots state in scripts.js. -->
      <div id="plots-container"></div>
      <div class="character" id="player">
        <img src="idle180.png">
      </div>
    </div>
    <button type="button" class="quests-toggle" aria-expanded="false" aria-controls="quest-content">Quests v</button>
    <div id="quest-content" class="collapsible-content">
      <div class="quests-container">
        <div class="quest-card">Card 1</div>
        <div class="quest-card">Card 2</div>
        <div class="quest-card">Card 3</div>
      </div>
    </div>
    <div id="action-buttons" class="d-flex flex-column align-items-stretch">
      <button id="settings-btn" type="button" aria-label="Settings">
        <img src="menu-icon.png" alt="menu icon">
      </button>
      <button id="shop-btn" type="button" aria-label="Shop">
        <img src="store-icon.png" alt="Store icon">
      </button>
      <button id="inventory-btn" type="button" aria-label="Inventory">
        <img src="bag-icon.png" alt="Inventory icon">
      </button>
    </div>
    <div id="inventory-panel" class="hidden" aria-label="Inventory">
      <div id="inventory-slots"></div>
    </div>

    <div id="settings-panel" class="hidden" aria-label="Settings">
      <h2>Settings</h2>
      <button id="close-settings-btn" type="button" aria-label="Close Settings">&times;</button>
      <div class="option-item">
        <label for="music-slider">Music:</label>
        <input type="range" id="music-slider" min="0" max="100" value="50">
      </div>
      <div class="option-item">
        <label for="sfx-slider">SFX:</label>
        <input type="range" id="sfx-slider" min="0" max="100" value="50">
      </div>
      <button id="credits-btn" type="button">Credits</button>
      <button id="return-btn" type="button">Return to Title</button>
    </div>
    <div id="shop-modal-overlay" class="hidden">
      <div id="shop-modal-box">
        <button id="close-shop-btn">&times;</button>

        <h2>Shop</h2>
        <div id="shop-wallet">Wallet: <span id="wallet-coins"></span> 🪙</div>

        <div class="shop-tabs">
          <button id="tab-buy-btn" class="active-tab">Buy Seeds</button>
          <button id="tab-sell-btn">Sell Crops</button>
        </div>

        <label class="visually-hidden" for="shop-search">Search shop items</label>
        <input id="shop-search" type="search" placeholder="Search crops..." autocomplete="off">

        <!-- Dynamic Content Area -->
        <div id="shop-items-container">
          <!-- Item cards will be dynamically generated by JS -->
        </div>
      </div>
    </div>
    <button id="kana-reference-btn" type="button">あ/ア</button>
    <button id="practice-btn">🌱 Practice</button>

    <div id="quiz-modal-overlay" class="hidden">
      <div id="quiz-modal-box">
        <button id="close-modal-btn">&times;</button>
        <!-- NEW: Mode Selection Screen -->
        <div id="mode-selection-menu">
          <h2><b>Select a Practice Mode!</b></h2>
          <div class="menu-grid">
            <button class="mode-btn" data-mode="hiragana">🇯🇵 Hiragana</button>
            <button class="mode-btn" data-mode="katakana">🎏 Katakana</button>
            <button class="mode-btn" data-mode="matching">🧩 Kana Matching</button>
            <button class="mode-btn" data-mode="free">🌟 Free Mode</button>
            <button class="mode-btn" data-mode="timed" id="timed-mode-btn"
              style="grid-column: span 2; background-color: #ffe0b2; border-color: #ffb74d;">⏱️ Timed Practice</button>
          </div>
        </div>
        <div id="question-gameplay-screen" class="hidden">
          <div id="modal-timer" class="hidden"
            style="font-size: 24px; font-weight: bold; margin-bottom: 15px; color: #ff9800;">⏱️ <span
              id="modal-timer-countdown">60</span>s</div>
          <div id="question-text">Loading question...</div>
          <div id="choices-container"></div>
          <!-- 4 answer choices will be dynamically injected here via JS -->
        </div>
        <div id="feedback-text" class="hidden"></div>
      </div>
    </div>

    <div id="level-up-overlay" class="hidden">
      <div id="level-up-box">
        <h2>Level Up!</h2>
        <p id="level-up-message"></p>
        <h3>New crops unlocked!</h3>
        <div id="unlocked-crops-container"></div>
        <button id="level-up-close-btn" type="button">Continue</button>
      </div>
    </div>

    <div id="kana-reference-overlay" class="hidden">
      <div id="kana-reference-box">
        <button id="close-kana-reference-btn" type="button">&times;</button>
        <h2>Kana Reference</h2>
        <div id="kana-reference-grid"></div>
      </div>
    </div>
  </div>
  <script src="scripts.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
