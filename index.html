<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NihongoGarden</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <div id="main-scene">
    <div id="top-bar">
      <div class="hud-stat">🪙 <span id="hud-coins">10</span></div>
      <div class="hud-stat">⭐ LVL <span id="hud-level">0</span></div>
      <div class="hud-stat">⚡ EXP: <span id="hud-exp">0/100</span></div>
    </div>

    <div id="plots">
      <div id="plant"></div>
    </div>
    <div class="character" id="player">
      <img src="idle180.png">
    </div>
    <button id="shop-btn">🛒 Shop</button>

    <div id="shop-modal-overlay" class="hidden">
      <div id="shop-modal-box">
        <button id="close-shop-btn">&times;</button>

        <h2>Garden Shop</h2>
        <div id="shop-wallet">Wallet: <span id="wallet-coins">10</span> 🪙</div>

        <div class="shop-tabs">
          <button id="tab-buy-btn" class="active-tab">Buy Seeds</button>
          <button id="tab-sell-btn">Sell Crops</button>
        </div>

        <!-- Dynamic Content Area -->
        <div id="shop-items-container">
          <!-- Item cards will be dynamically generated by JS -->
        </div>
      </div>
    </div>
    <button id="practice-btn">🌱 Practice</button>

    <div id="quiz-modal-overlay" class="hidden">
      <div id="quiz-modal-box">
        <button id="close-modal-btn">&times;</button>
        <!-- NEW: Mode Selection Screen -->
        <div id="mode-selection-menu">
          <h2>Select Your Practice Mode</h2>
          <div class="menu-grid">
            <button class="mode-btn" data-mode="hiragana">🇯🇵 Hiragana</button>
            <button class="mode-btn" data-mode="katakana">🎏 Katakana</button>
            <button class="mode-btn" data-mode="matching">🧩 Kana Matching</button>
            <button class="mode-btn" data-mode="free">🌟 Free Mode</button>
            <button class="mode-btn" data-mode="timed" id="timed-mode-btn"
              style="grid-column: span 2; background-color: #ffe0b2; border-color: #ffb74d;">⏱️ Timed Practice</button>
          </div>
        </div>
        <div id="question-gameplay-screen" class="hidden">
          <div id="modal-timer" class="hidden" style="font-size: 24px; font-weight: bold; margin-bottom: 15px; color: #ff9800;">⏱️ <span id="modal-timer-countdown">60</span>s</div>
          <div id="question-text">Loading question...</div>
          <div id="choices-container"></div>
          <!-- 4 answer choices will be dynamically injected here via JS -->
        </div>
        <div id="feedback-text" class="hidden"></div>
      </div>
    </div>
  </div>
  <script src="scripts.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
